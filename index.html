<section id="signals">
  <h2>Latest Forex Signals</h2>
  <div id="signal-list">Loading signals...</div>
</section>

<script>
  // Fetch signals from signals.txt
  fetch('signals.txt')
    .then(response => response.text())
    .then(data => {
      const lines = data.split('\n');
      let output = '';
      lines.forEach(line => {
        if(line.trim() !== '') {
          output += `<div class="signal"><p>${line}</p></div>`;
        }
      });
      document.getElementById('signal-list').innerHTML = output;
    })
    .catch(err => {
      document.getElementById('signal-list').innerHTML = "⚠️ Could not load signals.";
    });
</script>
